[workspace]
resolver = "3"
members = ["crates/localhost-core", "crates/localhost-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Liwidale"]
license = "MIT"
repository = "https://github.com/liwidale/localhost"

[workspace.dependencies]
localhost-core = { path = "crates/localhost-core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "process", "macros"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
